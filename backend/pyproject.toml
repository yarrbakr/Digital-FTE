[project]
name = "digital-fte-backend"
version = "0.1.0"
description = "Digital FTE — provider-agnostic AI employee backend (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Config & data
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "cryptography>=43.0.0",
    # HTTP client (LLM providers)
    "httpx>=0.27.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # Channels
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "slack-sdk>=3.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
